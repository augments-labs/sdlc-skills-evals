name: static

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck runners, seams, launchers, fixtures
        run: shellcheck bin/* lib/*.sh harnesses/*.sh fixtures/*.sh
      - name: static gate
        run: bash bin/check
      - name: offline seam tests
        run: |
          for t in lib/tests/*.sh; do
            [ -e "$t" ] || continue
            bash "$t" || { echo "FAIL $t"; exit 1; }
          done
